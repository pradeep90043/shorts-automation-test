name: Renderer quality checks

on:
  push:
    branches: [dev, dev-session]
    paths:
      - "scripts/render_short.py"
      - ".github/workflows/render-short.yml"
      - ".github/workflows/renderer-quality-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Devanagari font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-noto-core
      - name: Check Python syntax
        run: python3 -m py_compile scripts/render_short.py
      - name: Verify the requested Hindi font resolves
        run: |
          match="$(fc-match -f '%{family}|%{file}' 'Noto Sans Devanagari:lang=hi')"
          echo "$match" | grep -q 'Noto Sans Devanagari'
          font_file="${match#*|}"
          test -s "$font_file"

      - name: Smoke-render a long Hindi caption
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/captions.ass" <<'ASS'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans Devanagari,64,&H00FFFFFF,&H0000FFFF,&H00000000,&H80000000,1,0,1,3,0,8,60,60,30,1
          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:00:02.00,Default,,0,0,0,,नमस्ते दुनिया और यह लंबा caption भी fit होना चाहिए
          ASS
          ffmpeg -hide_banner -f lavfi -i color=c=black:s=1080x1920:d=1 \
            -vf "subtitles=$tmp/captions.ass:force_style='FontName=Noto Sans Devanagari,FontSize=48,Alignment=8,MarginV=28,MarginL=60,MarginR=60,Outline=2,Shadow=0,WrapStyle=0'" \
            -frames:v 1 -f null -
      - name: Verify audio limiter keeps peaks below full scale
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -f lavfi -i 'sine=frequency=1000:duration=2' \
            -af 'volume=10,alimiter=limit=0.85:attack=5:release=50:level=0,volumedetect' \
            -f null - 2>&1 | tee /tmp/limiter.log
          max_volume="$(sed -n 's/.*max_volume: \([-0-9.]*\) dB/\1/p' /tmp/limiter.log | tail -1)"
          python3 - "$max_volume" <<'PY'
import sys
peak = float(sys.argv[1])
if peak > -1.3:
    raise SystemExit(f"Limiter output too hot: {peak} dBFS")
print(f"Limiter smoke test passed: {peak} dBFS")
PY
